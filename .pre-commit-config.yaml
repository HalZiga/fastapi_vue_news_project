repos:
  # Хуки для общих проверок
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Хуки для Python (только для папки FAPI)
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        args: ["--line-length=88"]
        files: "^FAPI/.*\\.py$" # Применяем только к файлам .py в папке FAPI

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: "^FAPI/.*\\.py$" # Применяем только к файлам .py в папке FAPI

  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--ignore=E203,W503"]
        files: "^FAPI/.*\\.py$" # Применяем только к файлам .py в папке FAPI

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd vue-project && npx prettier --write .'
        language: system
        files: "^vue-project/.*\\.(js|ts|json|vue|html|css|scss)$"
      - id: eslint
        name: ESLint
        entry: bash -c 'cd vue-project && npx eslint . --fix'
        language: system
        files: "^vue-project/.*\\.(js|ts|vue)$"
